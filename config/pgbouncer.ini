;; PgBouncer перед кластером: приложение и чекер ходят сюда (порт 6432).
;; Пул смотрит не в конкретный узел, а в HAProxy -> всегда текущий лидер.
[databases]
;; «*» - любая база: crm_service_db, catalog_service_db, pos_service_db, wms_service_db
* = host=haproxy port=5000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
;; учебно: пароли открытым текстом в userlist.txt. В проде - auth_query + scram.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

;; transaction pooling: серверное соединение выдаётся на время транзакции.
;; Чекер, тесты и генератор работают целыми транзакциями - это безопасно.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

;; короткая жизнь серверных соединений - после failover пул быстрее переедет
server_lifetime = 120
server_idle_timeout = 60
server_login_retry = 2
query_wait_timeout = 30

ignore_startup_parameters = extra_float_digits,options
max_prepared_statements = 200
