# HAProxy: единая точка входа в кластер. Где сейчас лидер - узнаёт у Patroni
# REST API (GET /primary = 200 только на лидере, GET /replica = 200 на живых репликах).
global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   3s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

# ЗАПИСЬ -> текущий лидер
listen postgres_rw
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 300 check port 8008
    server pg2 pg2:5432 maxconn 300 check port 8008
    server pg3 pg3:5432 maxconn 300 check port 8008

# ЧТЕНИЕ -> реплики (round robin)
listen postgres_ro
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 300 check port 8008
    server pg2 pg2:5432 maxconn 300 check port 8008
    server pg3 pg3:5432 maxconn 300 check port 8008
