# Конфиг мастера. Конфиг лежит вне PGDATA, поэтому каталог данных задан явно
# (в образе postgres:18 PGDATA = /var/lib/postgresql/18/docker).
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/postgresql/pg_hba.conf'
listen_addresses = '*'
max_connections = 100

# --- WAL / CDC ---------------------------------------------------------------
# logical: нужен для CDC в ДЗ2 (publication + логическое декодирование).
# Физической реплике его тоже достаточно (logical > replica).
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
max_slot_wal_keep_size = 1GB

# --- реплика -------------------------------------------------------------------
hot_standby = on
hot_standby_feedback = on

# --- лог -------------------------------------------------------------------------
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %u@%d '
